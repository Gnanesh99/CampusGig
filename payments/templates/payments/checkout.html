
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Checkout - CampusGig</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Payment Checkout</h2>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% else %}
        <div class="card mt-4 p-4">
            <h4>Gig: {{ payment.assignment.application.gig.title }}</h4>
            <p><strong>Amount:</strong> ₹{{ payment.amount }}</p>
            <p><strong>Order ID:</strong> {{ payment.razorpay_order_id }}</p>

            <button id="rzp-button1" class="btn btn-primary mt-3">Pay Now</button>
        </div>

        <!-- Razorpay Checkout Script -->
        <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
        <script>
            var options = {
                "key": "{{ razorpay_key_id }}",
                "amount": "{{ amount_in_paise }}",
                "currency": "{{ currency }}",
                "name": "CampusGig",
                "description": "Payment for Gig: {{ payment.assignment.application.gig.title }}",
                "order_id": "{{ payment.razorpay_order_id }}",
                "handler": function (response){
                    const verifyUrl = "{% url 'payments:verify' %}";
                    const csrfToken = "{{ csrf_token }}";

                    fetch(verifyUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_signature: response.razorpay_signature
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if(data.status === 'success' || data.status === 'Already Paid') {
                            alert('Payment verified successfully!');
                            window.location.href = "{% url 'home' %}";
                        } else {
                            alert('Payment verification failed: ' + (data.error || 'Unknown error'));
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        alert('Server error during verification.');
                    });
                },
                "prefill": {
                    "name": "{{ request.user.get_full_name|default:request.user.email }}",
                    "email": "{{ request.user.email }}"
                },
                "theme": {
                    "color": "#3399cc"
                }
            };
            var rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                alert('Payment failed: ' + response.error.description);
                console.log(response.error);
            });
            document.getElementById('rzp-button1').onclick = function(e){
                rzp1.open();
                e.preventDefault();
            }
        </script>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
