<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Applications Received</title>
</head>
<body>
    <h1>Applications Received</h1>
    <ul>
        {% for application in applications %}
        <li>
            <a href="{% url 'employer-application-status-update' application.pk %}">
                <strong>{{ application.gig.title }}</strong>
            </a>
            - {{ application.status }}
        </li>
        {% empty %}
            <li>No applications have been received for your gigs yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
